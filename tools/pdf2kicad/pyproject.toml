[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2kicad"
version = "0.2.0"
description = "Schematic PDF page -> netlist/parts/pins CSV -> KiCad .kicad_sch (KiCad vector PDFs; experimental)"
requires-python = ">=3.9"
dependencies = ["pymupdf>=1.23", "numpy>=1.24"]

[project.scripts]
pdf2kicad = "pdf2kicad.cli:cli"

[tool.setuptools]
packages = ["pdf2kicad"]

[tool.setuptools.package-data]
pdf2kicad = ["../data/*.json"]
