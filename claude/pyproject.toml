[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecci"
version = "0.1.0.dev1"
description = "ECCI (Evidence-Carrying Connectivity Inference): PDF schematic geometry, milestone M1"
requires-python = ">=3.11"
dependencies = ["pikepdf>=9.0"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6.100", "pymupdf>=1.24"]

[tool.setuptools.packages.find]
include = ["ecci*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "crosscheck: compares against an independent extractor (PyMuPDF); skipped = UNKNOWN, never PASS",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
