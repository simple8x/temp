name: pdf2kicad planar graph prototype

on:
  pull_request:
    paths:
      - "tools/pdf2kicad/pdf2kicad/evidence_ir.py"
      - "tools/pdf2kicad/tests/test_evidence_ir.py"
      - "tools/pdf2kicad/pdf2kicad/planar_graph.py"
      - "tools/pdf2kicad/pdf2kicad/cli.py"
      - "tools/pdf2kicad/pdf2kicad/netlist.py"
      - "tools/pdf2kicad/pdf2kicad/topology.py"
      - "tools/pdf2kicad/pdf2kicad/graph_netlist.py"
      - "tools/pdf2kicad/pdf2kicad/sheet_geometry.py"
      - "tools/pdf2kicad/tests/test_sheet_geometry.py"
      - "tools/pdf2kicad/tests/test_graph_netlist.py"
      - "tools/pdf2kicad/tests/test_planar_graph.py"
      - "tools/pdf2kicad/tests/test_pin_matching.py"
      - "tools/pdf2kicad/tests/run_planar_graph_real_pdf_audit.py"
      - "tools/pdf2kicad/tools/roundtrip_pipeline.py"
      - "tools/pdf2kicad/tests/test_roundtrip_pipeline.py"
      - "tools/pdf2kicad/tests/run_candidate_kicad_roundtrip.py"
      - ".github/workflows/pdf2kicad-planar-graph.yml"
      - "QI9-2604-A01_G3-G4_PAGE6_REFINEMENT/source/**"
  push:
    branches:
      - "feat/pdf2kicad-planar-graph-v1"
      - "manus"
    paths:
      - "tools/pdf2kicad/tests/test_connectivity_evidence.py"
      - "tools/pdf2kicad/pdf2kicad/connectivity_evidence.py"
      - "tools/pdf2kicad/tests/test_pin_matching.py"
      - "tools/pdf2kicad/pdf2kicad/planar_graph.py"
      - "tools/pdf2kicad/pdf2kicad/cli.py"
      - "tools/pdf2kicad/pdf2kicad/netlist.py"
      - "tools/pdf2kicad/pdf2kicad/topology.py"
      - "tools/pdf2kicad/pdf2kicad/graph_netlist.py"
      - "tools/pdf2kicad/pdf2kicad/sheet_geometry.py"
      - "tools/pdf2kicad/tests/test_sheet_geometry.py"
      - "tools/pdf2kicad/tests/test_graph_netlist.py"
      - "tools/pdf2kicad/tests/test_planar_graph.py"
      - "tools/pdf2kicad/tests/run_planar_graph_real_pdf_audit.py"
      - "tools/pdf2kicad/tools/roundtrip_pipeline.py"
      - "tools/pdf2kicad/tests/test_roundtrip_pipeline.py"
      - ".github/workflows/pdf2kicad-planar-graph.yml"
      - "QI9-2604-A01_G3-G4_PAGE6_REFINEMENT/source/**"

jobs:
  planar-graph-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
        working-directory: tools/pdf2kicad
      - run: python -m pytest -q tools/pdf2kicad/tests
      - name: Run real QI9 PDF planar-graph diagnostic
        run: python tools/pdf2kicad/tests/run_planar_graph_real_pdf_audit.py
      - name: Render one PDF crop for every reference-review terminal
        run: |
          python tools/pdf2kicad/tests/build_pdf_terminal_review_sheet.py \
            --pdf "QI9-2604-A01_G3-G4_PAGE6_REFINEMENT/source/[QI9-2604-A01] Module IO.pdf" \
            --ledger reference_connectivity_review.json \
            --out terminal-reference-review --radius 60 --scale 1.25 --cards-per-page 8
      - name: Exercise production CLI writer on pages 5-11
        run: python tools/pdf2kicad/tests/run_production_cli_real_pdf.py
      - name: Build PDF-linked reference connectivity review candidates (pages 5-11)
        run: >-
          python tools/pdf2kicad/tools/roundtrip_pipeline.py
          "QI9-2604-A01_G3-G4_PAGE6_REFINEMENT/source/[QI9-2604-A01] Module IO.pdf"
          --pages 5-11 --outdir pdf2kicad_roundtrip
      - name: Generate candidate KiCad sheets and independent read-back (pages 5-11)
        run: >-
          python tools/pdf2kicad/tests/run_candidate_kicad_roundtrip.py
          --input production_cli_real_pdf --outdir pdf2kicad_candidate_schematics --pages 5-11
      - name: Upload real-PDF audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf2kicad-planar-graph-real-pdf-audit
          path: |
            planar_graph_real_pdf_audit.json
            reference_connectivity_review.json
            reference_connectivity_review.csv
            terminal-reference-review/**
            graph_netlist_candidate.csv
            production_graph_net_memberships.csv
            production_cli_real_pdf/**
            pdf2kicad_roundtrip/**
            pdf2kicad_candidate_schematics/**
          retention-days: 3
