name: schematicnetlist-qi9-independent-benchmark

on:
  push:
    branches: [experiment/schematicnetlist-qi9]
    paths:
      - ".github/workflows/schematicnetlist-qi9.yml"
      - "tools/pdf2kicad/forensics/independent_ocr_vector_fusion.py"
      - "tools/pdf2kicad/forensics/symbol_ownership_candidates.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/schematicnetlist-qi9

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pin and install upstream SchematicNetlist and PDF audit dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/sphrd/SchematicNetlist.git@22c51c3f31493c7fb510262d7eec29f3fd66a5ad"
          python -m pip install "PyMuPDF==1.26.7"

      - name: Install OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Verify source identity
        run: |
          PDF="QI9-2604-A01_G3-G4_PAGE6_REFINEMENT/source/[QI9-2604-A01] Module IO.pdf"
          test -s "$PDF"
          sha256sum "$PDF" | tee source-sha256.txt
          python - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path("QI9-2604-A01_G3-G4_PAGE6_REFINEMENT/source/[QI9-2604-A01] Module IO.pdf")
          got = hashlib.sha256(p.read_bytes()).hexdigest()
          expected = "a7860fba0cf7ea30e7c209b0ba7405481edfffd2abdcfffa00b465e08b2d45fc"
          print(f"PDF_SHA256={got}")
          if got != expected:
              raise SystemExit(f"source hash mismatch: expected {expected}, got {got}")
          PY

      - name: Run upstream engine on schematic pages 5-11
        run: |
          schematic-netlist analyze "QI9-2604-A01_G3-G4_PAGE6_REFINEMENT/source/[QI9-2604-A01] Module IO.pdf" \
            --output schematicnetlist-qi9-output \
            --name QI9-2604-A01 \
            --pages 5-11 \
            --workers 2 \
            --no-spice

      - name: Compare component enumeration with source BOM and summarize limitations
        run: |
          python - <<'PY'
          import json, re, fitz
          from pathlib import Path
          from collections import Counter
          pdf = Path("QI9-2604-A01_G3-G4_PAGE6_REFINEMENT/source/[QI9-2604-A01] Module IO.pdf")
          out = Path("schematicnetlist-qi9-output")
          doc = json.loads((out / "QI9-2604-A01_netlist.json").read_text(encoding="utf-8"))
          source = fitz.open(pdf)
          bom_text = "\n".join(source[i].get_text() for i in range(1, 4))
          token_re = re.compile(r"\b(?:RN|SW|C|D|F|J|L|Q|R|U|Y)\d+\b")
          expected = sorted(set(token_re.findall(bom_text)))
          parts = doc.get("parts", [])
          found = sorted({p.get("refdes", "") for p in parts if p.get("refdes")})
          pin_rows = [pin for part in parts for pin in part.get("pins", [])]
          net_rows = [pin for net in doc.get("nets", []) for pin in net.get("pins", [])]
          warnings = doc.get("warnings", [])
          summary = {
            "source_pdf": str(pdf),
            "source_sha256": "a7860fba0cf7ea30e7c209b0ba7405481edfffd2abdcfffa00b465e08b2d45fc",
            "engine": "SchematicNetlist",
            "engine_commit": "22c51c3f31493c7fb510262d7eec29f3fd66a5ad",
            "pages_analyzed": doc.get("pages", []),
            "parts_detected": len(parts),
            "nets_detected": len(doc.get("nets", [])),
            "nets_with_pin_membership": sum(bool(n.get("pins")) for n in doc.get("nets", [])),
            "part_pin_records": len(pin_rows),
            "net_pin_memberships": len(net_rows),
            "bom_reference_count": len(expected),
            "detected_reference_count": len(found),
            "bom_refs_missing_from_engine": sorted(set(expected) - set(found)),
            "engine_refs_not_in_bom": sorted(set(found) - set(expected)),
            "pin_records_without_number": sum(not p.get("number") for p in pin_rows),
            "warnings_count": len(warnings),
            "warnings_by_level": dict(Counter(w.get("level", "UNKNOWN") for w in warnings)),
            "warning_texts": [w.get("text", str(w)) for w in warnings],
            "electrical_connectivity_verdict": "NOT_VERIFIED",
            "limitation": "No independent reference netlist/ground truth exists for these pages; engine output is not proof of electrical correctness."
          }
          (out / "benchmark_summary.json").write_text(json.dumps(summary, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          PY

      - name: Build independent OCR and vector forensic candidate inventory
        run: |
          python tools/pdf2kicad/forensics/visio_outline_ocr_probe.py \
            "QI9-2604-A01_G3-G4_PAGE6_REFINEMENT/source/[QI9-2604-A01] Module IO.pdf" \
            --out schematicnetlist-qi9-output/visio_outline_ocr_probe.json \
            --first-page 5 --last-page 11 --scale 2.5

      - name: Run independent OCR TSV and vector geometry fusion
        run: |
          python tools/pdf2kicad/forensics/independent_ocr_vector_fusion.py --self-test
          python tools/pdf2kicad/forensics/independent_ocr_vector_fusion.py --pdf "QI9-2604-A01_G3-G4_PAGE6_REFINEMENT/source/[QI9-2604-A01] Module IO.pdf" --outdir schematicnetlist-qi9-output/independent-fusion --pages 5 6 7 8 9 10 11 --scale 3.0

      - name: Run ECSR topology + global reference assignment (never promote ownership)
        run: |
          python tools/pdf2kicad/forensics/symbol_ownership_candidates.py --self-test
          python tools/pdf2kicad/forensics/symbol_ownership_candidates.py --input schematicnetlist-qi9-output/independent-fusion/independent_ocr_vector_fusion.json --output schematicnetlist-qi9-output/ecsr_geometric_core.json

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schematicnetlist-qi9-independent-benchmark
          path: |
            source-sha256.txt
            schematicnetlist-qi9-output/**
          if-no-files-found: warn
          retention-days: 7
