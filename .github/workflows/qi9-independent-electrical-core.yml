name: qi9-independent-electrical-core
on:
  push:
    branches: [experiment/qi9-independent-electrical-core]
    paths:
      - ".github/workflows/qi9-independent-electrical-core.yml"
      - "tools/pdf2kicad/independent_electrical_core.py"
      - "tools/pdf2kicad/independent_pdf_audit.py"
      - "tools/pdf2kicad/path_role_classifier.py"
      - "tools/pdf2kicad/path_role_audit.py"
      - "tools/pdf2kicad/pdf_native_object_audit.py"
      - "tools/pdf2kicad/tests_independent/**"
      - "tools/pdf2kicad/fixtures/**"
      - "tools/pdf2kicad/pdf2kicad/independent_pdf_reconstruction.py"
      - "tools/pdf2kicad/pdf2kicad/electrical_evidence.py"
      - "tools/pdf2kicad/pdf2kicad/glyphs.py"
      - "tools/pdf2kicad/pdf2kicad/font.py"
      - "tools/pdf2kicad/pdf2kicad/textdecode.py"
      - "tools/pdf2kicad/pdf2kicad/primitives.py"
      - "tools/pdf2kicad/data/newstroke_ascii.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PyMuPDF==1.26.7" "numpy==2.2.6" pytest
      - name: Validate adversarial labeled oracle
        run: |
          PYTHONPATH=tools/pdf2kicad pytest -q tools/pdf2kicad/tests_independent
          python tools/pdf2kicad/independent_electrical_core.py --out independent-oracle-report.json
      - name: Audit path-group classifier on schematic page 6
        run: |
          python tools/pdf2kicad/path_role_audit.py \
            --pdf "QI9-2604-A01_G3-G4_PAGE6_REFINEMENT/source/[QI9-2604-A01] Module IO.pdf" \
            --page 6 --out independent-pdf-audit/page6_path_role_audit.json
      - name: Preserve native PDF drawing objects and render page 6
        run: |
          python tools/pdf2kicad/pdf_native_object_audit.py \
            --pdf "QI9-2604-A01_G3-G4_PAGE6_REFINEMENT/source/[QI9-2604-A01] Module IO.pdf" \
            --page 6 --outdir native-pdf-object-audit --dpi 120
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qi9-independent-electrical-core
          path: |
            independent-oracle-report.json
            independent-pdf-audit/**
            native-pdf-object-audit/**
          if-no-files-found: warn
          retention-days: 7
