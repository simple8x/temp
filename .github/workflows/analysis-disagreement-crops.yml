name: Analysis — disagreement crop pack

on:
  push:
    branches:
      - analysis/qi9-deepseek-manus-disagreement-register
    paths:
      - "analysis/build_disagreement_crops.py"
      - "analysis/qi9-deepseek-manus-disagreement-register.csv"
      - "QI9-2604-A01_G3-G4_PAGE6_REFINEMENT/artifacts/g0_intake/page-*.svg"
      - ".github/workflows/analysis-disagreement-crops.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-crops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install render dependencies
        run: python -m pip install --disable-pip-version-check cairosvg pillow
      - name: Build coordinate crops
        run: python analysis/build_disagreement_crops.py
      - name: Upload crop pack
        uses: actions/upload-artifact@v4
        with:
          name: qi9-disagreement-crop-pack
          path: analysis/disagreement-crops/
          if-no-files-found: error
          retention-days: 7
