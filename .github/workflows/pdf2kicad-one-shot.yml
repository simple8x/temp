name: pdf2kicad-one-shot
on:
  push:
    branches: [import/pdf2kicad]
    paths:
      - ".github/workflows/pdf2kicad-one-shot.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: import/pdf2kicad
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package dependencies
        working-directory: tools/pdf2kicad
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run pdf2kicad on all schematic pages
        working-directory: tools/pdf2kicad
        run: |
          set -euo pipefail
          PDF="../../QI9-2604-A01_G3-G4_PAGE6_REFINEMENT/-QI9-2604-A01- Module IO.pdf"
          mkdir -p ../../pdf2kicad-run/logs
          for page in 5 6 7 8 9 10 11; do
            {
              echo "===== PAGE $page INFO ====="
              python -m pdf2kicad.cli "$PDF" "$page" "../../pdf2kicad-run/page$(printf '%02d' "$page")" --info
              echo "===== PAGE $page EXTRACT ====="
              python -m pdf2kicad.cli "$PDF" "$page" "../../pdf2kicad-run/page$(printf '%02d' "$page")"
            } 2>&1 | tee "../../pdf2kicad-run/logs/page$(printf '%02d' "$page").log"
          done
          python tools/make_project.py ../../pdf2kicad-run/project ../../pdf2kicad-run
          find ../../pdf2kicad-run -type f -maxdepth 4 -print -exec sha256sum {} \;
      - name: Install KiCad CLI validator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad
      - name: Validate generated schematic with KiCad CLI
        run: |
          set +e
          mkdir -p pdf2kicad-run/kicad-validation
          kicad-cli version 2>&1 | tee pdf2kicad-run/kicad-validation/version.log
          kicad-cli sch export netlist --output pdf2kicad-run/kicad-validation/Module_IO.net pdf2kicad-run/project/Module_IO.kicad_sch 2>&1 | tee pdf2kicad-run/kicad-validation/netlist.log
          NETLIST_RC=${PIPESTATUS[0]}
          kicad-cli sch erc --output pdf2kicad-run/kicad-validation/erc.rpt pdf2kicad-run/project/Module_IO.kicad_sch 2>&1 | tee pdf2kicad-run/kicad-validation/erc.log
          ERC_RC=${PIPESTATUS[0]}
          echo "KICAD_NETLIST_EXIT=$NETLIST_RC"
          echo "KICAD_ERC_EXIT=$ERC_RC"
          echo "KICAD_NETLIST_EXIT=$NETLIST_RC" >> pdf2kicad-run/kicad-validation/status.txt
          echo "KICAD_ERC_EXIT=$ERC_RC" >> pdf2kicad-run/kicad-validation/status.txt
          test "$NETLIST_RC" -eq 0
      - name: Upload extraction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf2kicad-qi9-2604-one-shot
          path: pdf2kicad-run/
          if-no-files-found: warn
          retention-days: 3
