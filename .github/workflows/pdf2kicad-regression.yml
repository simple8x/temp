name: pdf2kicad regression

on:
  pull_request:
    branches: [import/pdf2kicad]
    paths:
      - "tools/pdf2kicad/**"
      - ".github/workflows/pdf2kicad-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf2kicad-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/pdf2kicad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/pdf2kicad/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m pytest -q
      - name: Compile package
        run: python -m compileall -q pdf2kicad tools tests
