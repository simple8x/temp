name: pdf2kicad regression

on:
  push:
    branches: [fix/pdf2kicad-g3-g4-hardening]
    paths:
      - "tools/pdf2kicad/**"
      - ".github/workflows/pdf2kicad-regression.yml"
  pull_request:
    branches: [import/pdf2kicad]
    paths:
      - "tools/pdf2kicad/**"
      - ".github/workflows/pdf2kicad-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf2kicad-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/pdf2kicad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/pdf2kicad/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Checkout authoritative QI9 source PDF
        uses: actions/checkout@v4
        with:
          repository: simple8x/temp
          ref: audit/pdf2kicad-qi9-2604
          path: evidence
      - name: Run regression tests against synthetic and authoritative PDF evidence
        env:
          QI9_SOURCE_PDF: ${{ github.workspace }}/evidence/QI9-2604-A01_G3-G4_PAGE6_REFINEMENT/source/[QI9-2604-A01] Module IO.pdf
        run: python -m pytest -q
      - name: Compile package
        run: python -m compileall -q pdf2kicad tools tests
      - name: Generate junction evidence for schematic pages 5-11
        env:
          QI9_SOURCE_PDF: ${{ github.workspace }}/evidence/QI9-2604-A01_G3-G4_PAGE6_REFINEMENT/source/[QI9-2604-A01] Module IO.pdf
        run: python -m pdf2kicad.electrical_evidence "$QI9_SOURCE_PDF" --pages 5-11 --outdir junction-evidence
      - name: Generate parser connectivity evidence for schematic pages 5-11
        env:
          QI9_SOURCE_PDF: ${{ github.workspace }}/evidence/QI9-2604-A01_G3-G4_PAGE6_REFINEMENT/source/[QI9-2604-A01] Module IO.pdf
        run: |
          mkdir -p connectivity-evidence
          for page in 5 6 7 8 9 10 11; do
            python -m pdf2kicad.cli "$QI9_SOURCE_PDF" "$page" "connectivity-evidence/page${page}"
          done
      - name: Upload junction evidence
        uses: actions/upload-artifact@v4
        with:
          name: qi9-explicit-junction-evidence
          path: |
            tools/pdf2kicad/junction-evidence/
            tools/pdf2kicad/connectivity-evidence/
          if-no-files-found: error
          retention-days: 7
