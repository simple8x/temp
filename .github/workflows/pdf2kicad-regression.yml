name: pdf2kicad regression

on:
  push:
    branches: [fix/pdf2kicad-g3-g4-hardening]
    paths:
      - "tools/pdf2kicad/**"
      - ".github/workflows/pdf2kicad-regression.yml"
  pull_request:
    branches: [import/pdf2kicad]
    paths:
      - "tools/pdf2kicad/**"
      - ".github/workflows/pdf2kicad-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf2kicad-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/pdf2kicad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/pdf2kicad/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Checkout authoritative QI9 source PDF
        uses: actions/checkout@v4
        with:
          repository: simple8x/temp
          ref: dfd969d9479dbca8ffc9e4a1107ab6f87f26fade
          path: evidence
      - name: Write immutable source manifest
        env:
          QI9_SOURCE_PDF: ${{ github.workspace }}/evidence/QI9-2604-A01_G3-G4_PAGE6_REFINEMENT/source/[QI9-2604-A01] Module IO.pdf
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          pdf = Path(os.environ["QI9_SOURCE_PDF"])
          source_repo = Path(os.environ["GITHUB_WORKSPACE"]) / "evidence"
          source_commit = subprocess.check_output(
              ["git", "-C", str(source_repo), "rev-parse", "HEAD"], text=True
          ).strip()
          import fitz
          source_document = fitz.open(pdf)
          page_count = len(source_document)
          source_document.close()
          manifest = {
              "schema": "pdf2kicad-source-manifest/v1",
              "source_repository": "simple8x/temp",
              "source_ref": "dfd969d9479dbca8ffc9e4a1107ab6f87f26fade",
              "resolved_source_commit": source_commit,
              "pdf_relative_path": str(pdf.relative_to(Path(os.environ["GITHUB_WORKSPACE"]).resolve() / "evidence")),
              "pdf_sha256": hashlib.sha256(pdf.read_bytes()).hexdigest(),
              "page_count": page_count,
              "schematic_pages_extracted": [5, 6, 7, 8, 9, 10, 11],
          }
          Path("source_manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(manifest, indent=2))
          PY
      - name: Run regression tests against synthetic and authoritative PDF evidence
        env:
          QI9_SOURCE_PDF: ${{ github.workspace }}/evidence/QI9-2604-A01_G3-G4_PAGE6_REFINEMENT/source/[QI9-2604-A01] Module IO.pdf
        run: python -m pytest -q
      - name: Compile package
        run: python -m compileall -q pdf2kicad tools tests
      - name: Generate junction evidence for schematic pages 5-11
        env:
          QI9_SOURCE_PDF: ${{ github.workspace }}/evidence/QI9-2604-A01_G3-G4_PAGE6_REFINEMENT/source/[QI9-2604-A01] Module IO.pdf
        run: python -m pdf2kicad.electrical_evidence "$QI9_SOURCE_PDF" --pages 5-11 --outdir junction-evidence
      - name: Generate parser connectivity evidence for schematic pages 5-11
        env:
          QI9_SOURCE_PDF: ${{ github.workspace }}/evidence/QI9-2604-A01_G3-G4_PAGE6_REFINEMENT/source/[QI9-2604-A01] Module IO.pdf
        run: |
          mkdir -p connectivity-evidence
          for page in 5 6 7 8 9 10 11; do
            python -m pdf2kicad.cli "$QI9_SOURCE_PDF" "$page" "connectivity-evidence/page${page}"
          done
      - name: Render explicit NC source-PDF crops for review
        env:
          QI9_SOURCE_PDF: ${{ github.workspace }}/evidence/QI9-2604-A01_G3-G4_PAGE6_REFINEMENT/source/[QI9-2604-A01] Module IO.pdf
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          import fitz
          pdf = fitz.open(__import__("os").environ["QI9_SOURCE_PDF"])
          out = Path("nc-crops")
          out.mkdir(exist_ok=True)
          for page_no in range(5, 12):
              csv_path = Path(f"connectivity-evidence/page{page_no}/no_connect.csv")
              if not csv_path.exists():
                  continue
              with csv_path.open(newline="", encoding="utf-8") as handle:
                  rows = list(csv.DictReader(handle))
              page = pdf[page_no - 1]
              for index, row in enumerate(rows, 1):
                  x, y = float(row["terminal_x"]), float(row["terminal_y"])
                  clip = fitz.Rect(x - 18, y - 18, x + 18, y + 18) & page.rect
                  pix = page.get_pixmap(matrix=fitz.Matrix(3, 3), clip=clip, alpha=False)
                  pix.save(out / f"page{page_no:02d}_nc{index:02d}.png")
          pdf.close()
          print(f"rendered {len(list(out.glob('*.png')))} explicit-NC review crops")
          PY
      - name: Upload junction and connectivity evidence
        uses: actions/upload-artifact@v4
        with:
          name: qi9-g3-g4-parser-evidence
          path: |
            tools/pdf2kicad/junction-evidence/
            tools/pdf2kicad/connectivity-evidence/
            tools/pdf2kicad/source_manifest.json
            tools/pdf2kicad/nc-crops/
          if-no-files-found: error
          retention-days: 7
