name: claude-m1

on:
  # Run on every update to the isolated branch. A paths filter here would let a
  # PR that changes only forbidden files bypass the isolation gate entirely.
  push:
    branches: [claude]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-m1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PR events default to the synthetic merge ref. Audit the source branch
          # head instead so main's history is not misclassified as branch changes.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Isolation gate (only claude/** and claude-*.yml may change)
        run: |
          set -o pipefail
          mkdir -p out
          bash claude/tools/check_isolation.sh 2>&1 | tee out/isolation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolation-log
          path: out/isolation.log

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: claude
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -c "import pikepdf, pymupdf, hypothesis; print('pikepdf', pikepdf.__version__, 'pymupdf', pymupdf.__version__, 'hypothesis', hypothesis.__version__)" | tee env.log
          python --version | tee -a env.log
      - name: Tests
        run: |
          mkdir -p out
          set -o pipefail
          python -m pytest -rA --junitxml=out/junit.xml 2>&1 | tee out/pytest.log
      - name: Summarize (SKIPPED counts as UNKNOWN and fails the job)
        if: always()
        run: python tools/summarize_junit.py out/junit.xml out | tee out/summary.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence-py${{ matrix.python }}
          path: |
            claude/out/
            claude/env.log

  kicad:
    # M4.2: native .kicad_sch export read back by the REAL kicad-cli (pinned build, see gt_source.txt).
    # tests/kicad is collected only here (ECCI_KICAD_TESTS=1); a missing CLI fails these steps, never skips.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: claude
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install KiCad CLI (pinned)
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update -q
          pkg=$(grep '^KICAD_PKG=' tools/gt_source.txt | cut -d= -f2-)
          sudo apt-get install -y --no-install-recommends "kicad=$pkg"
          mkdir -p out/m4
          { kicad-cli version; dpkg-query -W kicad; } | tee out/m4/kicad_version.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: KiCad round-trip tests (real kicad-cli)
        run: |
          set -o pipefail
          ECCI_KICAD_TESTS=1 python -m pytest -rA tests/kicad --junitxml=out/m4/junit_kicad.xml 2>&1 | tee out/m4/pytest_kicad.log
      - name: Summarize (SKIPPED counts as UNKNOWN and fails the job)
        if: always()
        run: python tools/summarize_junit.py out/m4/junit_kicad.xml out/m4 | tee out/m4/summary_kicad.log
      - name: M4 self-test (scenes -> .kicad_sch -> fresh netlist -> V-W + V-G)
        if: always()
        run: |
          set -o pipefail
          python tools/m4_selftest.py 2>&1 | tee out/m4/m4_selftest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m4-kicad-selftest
          path: claude/out/m4/

  mutation:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: claude
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install KiCad CLI (pinned; M156/M157 are only detectable by the real round trip)
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update -q
          pkg=$(grep '^KICAD_PKG=' tools/gt_source.txt | cut -d= -f2-)
          sudo apt-get install -y --no-install-recommends "kicad=$pkg"
          kicad-cli version
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Mutation check (every injected bug must make the suite fail)
        env:
          ECCI_KICAD_TESTS: "1"
        run: |
          set -o pipefail
          mkdir -p out
          python tools/mutation_check.py 2>&1 | tee out/mutation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-evidence
          path: claude/out/
