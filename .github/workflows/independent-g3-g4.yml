name: Independent G3-G4 PDF retest

on:
  push:
    paths:
      - 'QI9-2604-A01_G3-G4_PAGE6_REFINEMENT/**'
      - '.github/workflows/independent-g3-g4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf-forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser and test tools
        run: python -m pip install --upgrade pip pymupdf pytest
      - name: Verify authoritative PDF and recompute all-page inventory
        shell: bash
        run: |
          set -euo pipefail
          ROOT="QI9-2604-A01_G3-G4_PAGE6_REFINEMENT"
          PDF="$ROOT/source/[QI9-2604-A01] Module IO.pdf"
          EXPECTED="a7860fba0cf7ea30e7c209b0ba7405481edfffd2abdcfffa00b465e08b2d45fc"
          mkdir -p "$ROOT/independent_retest"
          ACTUAL="$(sha256sum "$PDF" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          python - "$PDF" "$ROOT/independent_retest/pdf_retest.json" <<'PY'
          import sys, json, hashlib
          from pathlib import Path
          import fitz
          pdf_path, out_path = map(Path, sys.argv[1:])
          raw = pdf_path.read_bytes()
          doc = fitz.open(stream=raw, filetype="pdf")
          pages=[]
          for i, page in enumerate(doc):
              drawings=page.get_drawings()
              lines=sum(1 for d in drawings for item in d.get("items",[]) if item[0]=="l")
              filled=[]
              for di,d in enumerate(drawings):
                  rect=d.get("rect"); fill=d.get("fill")
                  if fill is None or rect is None: continue
                  w,h=abs(rect.width),abs(rect.height)
                  if w <= 4 and h <= 4:
                      filled.append({"drawing_index":di,"rect":[rect.x0,rect.y0,rect.x1,rect.y1],
                                     "width":w,"height":h,"items":len(d.get("items",[])),"fill":list(fill)})
              pages.append({"page":i+1,"width_pt":page.rect.width,"height_pt":page.rect.height,
                            "text_blocks":len(page.get_text("blocks")),"text_chars":len(page.get_text()),
                            "drawing_objects":len(drawings),"line_items":lines,
                            "small_filled_drawing_objects":len(filled),
                            "small_filled_geometry":filled if i==5 else []})
          result={"source_file":pdf_path.name,"sha256":hashlib.sha256(raw).hexdigest(),
                  "bytes":len(raw),"page_count":len(doc),"pymupdf_version":fitz.VersionBind,"pages":pages}
          Path(out_path).write_text(json.dumps(result,indent=2),encoding="utf-8")
          print(json.dumps({"sha256":result["sha256"],"bytes":len(raw),
                            "page_count":len(doc),"page6":pages[5]},indent=2))
          PY
      - name: Regenerate Page 6 classifier output from source PDF
        run: |
          set -euo pipefail
          ROOT="QI9-2604-A01_G3-G4_PAGE6_REFINEMENT"
          python "$ROOT/g3_g4_refinement/classify_page6.py" "$ROOT/-QI9-2604-A01- Module IO.pdf" --out "$ROOT/g3_g4_refinement/page6_wire_classification_candidates.json" | tee "$ROOT/independent_retest/page6_classifier.log"
      - name: Run explicit G3-G4 and Page 6 regression tests
        run: |
          set -euo pipefail
          ROOT="QI9-2604-A01_G3-G4_PAGE6_REFINEMENT"
          python -m pytest -q             "$ROOT/tests/test_topology_rules.py"             "$ROOT/tests/test_g3_g4.py"             "$ROOT/g3_g4_refinement/test_page6_classifier.py"             --disable-warnings --maxfail=1 | tee "$ROOT/independent_retest/pytest.log"
      - name: Upload independent evidence
        uses: actions/upload-artifact@v4
        with:
          name: qI9-2604-independent-g3-g4
          path: QI9-2604-A01_G3-G4_PAGE6_REFINEMENT/independent_retest/
          if-no-files-found: error
          retention-days: 7
